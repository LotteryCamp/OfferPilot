name: Backend CI

on:
  workflow_call:

permissions:
  contents: read
  checks: write

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint, types, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OFFERPILOT_TEST_DATABASE_URL: postgresql://offerpilot_app@127.0.0.1:5432/offerpilot_test
      OFFERPILOT_TEST_ADMIN_DATABASE_URL: postgresql://ci_admin@127.0.0.1:5432/offerpilot_test
    services:
      database:
        image: postgres:16
        env:
          POSTGRES_DB: offerpilot_test
          POSTGRES_USER: ci_admin
          POSTGRES_HOST_AUTH_METHOD: trust
          TZ: UTC
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ci_admin -d offerpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install backend dependencies
        run: uv sync --project backend --locked

      - name: Lint
        working-directory: backend
        run: uv run ruff check .

      - name: Check formatting
        working-directory: backend
        run: uv run ruff format --check .

      - name: Type check
        working-directory: backend
        run: uv run ty check

      - name: Prepare test database
        working-directory: backend
        run: |
          psql "$OFFERPILOT_TEST_ADMIN_DATABASE_URL" -w -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE offerpilot_app LOGIN"
          uv run python db/migrate.py --dsn "$OFFERPILOT_TEST_ADMIN_DATABASE_URL" migrate
          uv run python db/migrate.py --dsn "$OFFERPILOT_TEST_ADMIN_DATABASE_URL" seed
          psql "$OFFERPILOT_TEST_ADMIN_DATABASE_URL" -w -v ON_ERROR_STOP=1 \
            -f db/dev/roles.sql

      - name: Run tests with coverage
        working-directory: backend
        run: uv run pytest tests -q --cov --cov-report=term-missing --cov-report=lcov:lcov.info

      - name: Upload backend coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: backend/lcov.info
          if-no-files-found: error
