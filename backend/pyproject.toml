[project]
name = "backend"
version = "0.1.0"
description = "Backend based on FastAPI for OfferPilot"
readme = "README.md"
authors = [
    { name = "Watermelonabc", email = "2172718424@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.163.1",
    "openai>=3.55.0",
    "pydantic>=2.14.3",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]
