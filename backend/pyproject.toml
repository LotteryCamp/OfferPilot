[project]
name = "backend"
version = "0.1.0"
description = "Backend based on FastAPI for OfferPilot"
readme = "README.md"
authors = [
    { name = "Watermelonabc", email = "2172718424@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "email-validator>=2.2",
    "fastapi>=0.163.1",
    "openai>=3.55.0",
    "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.2.1",
    "pydantic>=2.14.3",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.38",
]

[project.scripts]
backend = "backend:main"
offerpilot-admin = "backend.admin_cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "semgrep>=1.79.0",
    "ty>=0.0.104",
]

[tool.coverage.run]
source = ["backend"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 60
