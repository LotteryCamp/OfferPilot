services:
  postgres:
    image: postgres:16
    container_name: offerpilot-db
    environment:
      POSTGRES_DB: offerpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: UTC
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d offerpilot"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - offerpilot_pgdata:/var/lib/postgresql/data

volumes:
  offerpilot_pgdata: